<!doctype html><meta charset="utf-8"><style>body{margin:0;font:15px system-ui}.case{border:1px solid #d8dfda;margin:18px 0;padding:14px}.head{display:flex;justify-content:space-between;gap:1rem;align-items:center}.scan{max-height:260px;max-width:100%;display:block;margin:10px auto;border:1px solid #ddd}iframe{width:100%;height:500px;border:1px solid #ddd}label{font-weight:600;background:#edf3ef;padding:.5rem .7rem;border-radius:4px}small{color:#59615e}@media(max-width:700px){iframe{height:330px}}</style><body><p><small>Rows are ranked by largest positive per-staff all-branch token-accuracy delta. The scan is context; the interactive panes are upstream 426 (left) and Arm A (right). Mark candidates to retain; selections persist in this browser. Comparisons load on demand; loading another unloads the prior editor.</small></p><div id="app"></div><script src="lazy-score-editor.js"></script><script>
const esc=encodeURIComponent, sets=[['ossq','OSSQ','token-position accuracy'],['pdmx_ned','PDMX','alignment-aware symbol-sequence similarity'],['lieder','LIEDER','token-position accuracy']];
async function run(){for(const [set,label,metric] of sets){const xs=await fetch(`devs-assets/checkpoints/${set}/manifest.json`,{cache:'no-store'}).then(x=>x.json());const visualNote=set==='pdmx_ned'?' These ten are the next non-tab, positive-improvement cases in final-MusicXML structural-difference order; all 15 tablature crops were excluded from the held-out split.':set==='lieder'?' These five were reselected by final-MusicXML structural difference (not by aggregate branch delta) so the engraving itself exposes the changed decoding.':'';let h=`<h2>${label} — ${xs.length} selected held-out cases</h2><p><small>Ranking metric: ${metric}.${visualNote}</small></p>`;for(const x of xs){const key=`homr-keep-${set}-${x.id}`, q=`devs-assets/checkpoints/${set}`,left=x.left||x.id+'__426.musicxml',right=x.right||x.id+'__arma.musicxml';h+=`<section class=case><div class=head><b>${x.id}: +${(x.delta*100).toFixed(2)} pp (${(x.base*100).toFixed(2)}% → ${(x.arma*100).toFixed(2)}%)${x.output_ned?` · output-change NED ${(x.output_ned*100).toFixed(2)}%`:''}</b><label><input type=checkbox data-k="${key}"> keep this example</label></div><img class=scan src="${q}/crops/${x.crop}" alt="scan input"><iframe data-score-editor="score-editor/index.html?compareLeft=${esc('/'+q+'/scores/'+left)}&compareRight=${esc('/'+q+'/scores/'+right)}&leftLabel=Upstream%20426&rightLabel=Arm%20A"></iframe></section>`}document.querySelector('#app').insertAdjacentHTML('beforeend',h)}installLazyScoreEditors(document.querySelector('#app'));for(const c of document.querySelectorAll('input[data-k]')){c.checked=localStorage.getItem(c.dataset.k)==='1';c.onchange=()=>localStorage.setItem(c.dataset.k,c.checked?'1':'0')}}run();</script>
