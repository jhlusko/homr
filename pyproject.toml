[project]
name = "homr"
description = "End-to-end Optical Music Recognition (OMR) system build on top of vision transformers."
authors = [{name = "Christian Liebhardt", email = "christian.liebhardt@arcor.de"}]
license = "AGPL-3.0"
readme = "README.md"
homepage = "https://github.com/liebharc/homr"
documentation = "https://github.com/liebharc/homr"
requires-python = "<3.16,>=3.11"
dependencies = [
  "numpy >= 2.4.2, < 3",
  "opencv-python-headless >= 4.13.0.92, < 5",
  "Pillow >= 12.1.1, < 13",
  "types-Pillow >= 10.2.0.20240822, < 11",
  "typing_extensions >= 4.15.0, < 5",
  "rapidocr >= 3.7.0, < 4",
  "onnxruntime >= 1.24.1, < 2",
  "requests >= 2.32.5, < 3",
  "pypdfium2 >= 4, < 6",
]
dynamic = ["version"]

[project.optional-dependencies]
gpu = [
  "onnxruntime-gpu >= 1.24.1, < 2",
]

[dependency-groups]
dev = [
  "pytest >= 9.0.2, < 10",
  "mypy >= 1.19.1, < 2",
  "black >= 26.1.0, < 27",
  "ruff >= 0.15.1, < 0.16",
  "isort >= 7.0.0, < 8",
  "pyupgrade >= 3.21.2, < 4",
  "pre-commit >= 4.5.1, < 5",
  "pyclean >= 3.5.0, < 4",
  "coverage >= 7.13.4, < 8",
  "augly >= 1.0.0, < 2",
  "editdistance >= 0.8.1, < 0.9",
  "augraphy >= 8.2.6, < 9",
  "transformers[torch] >= 4.53.2, < 5",
  "cairosvg >= 2.8.2, < 3",
  "verovio >= 6.2.1, < 7",
  "types-requests >= 2.32.4.20260107, < 3",
  "segmentation-models-pytorch >= 0.5.0, < 0.6",
  "pytorch-lightning >= 2.6.1, < 3",
  "x-transformers >= 2.16.1, < 3",
  "torch >= 2.7.1, < 3",
  "onnx >= 1.20.1, < 2",
  "onnx-simplifier >= 0.4.36, < 0.5",
  "onnxconverter-common >= 1.16.0, < 2",
  "albumentations >= 2.0.8, < 3",
  "tensorboard >= 2.20.0, < 3",
  "onnxscript >= 0.6.2, < 0.7",
  "music21 >= 10.3.0, < 11",
  "pyvips >= 3.1.1, < 4",
  "musicdiff >= 5.2, < 6",
  "datasets >= 5.0.0, < 6",
]
docs = [
  "sphinx == 7.3.7",
  "furo == 2023.9.10",
  "myst-parser == 2.0.0",
  "myst-nb == 1.1.0",
]

[tool.poetry]
version = "0.0.0"

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = "*", extras = ["plugin"] }

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "semver"
pattern  = "^v(?P<base>\\d+\\.\\d+\\.\\d+)(-?((?P<stage>[a-zA-Z]+)\\.?(?P<revision>\\d+)?))?"

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning"]
build-backend = "poetry_dynamic_versioning.backend"

## Tools
[tool.black]
target-version = ['py311']
line-length = 100
preview = true

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "S", # flake8-bandit
    "A", # flake8-builtins
    "INP", # flake8-no-pep420
    "PIE", # flake8-pie
    "PL", # pylint
    "TID252", # flake8-tidy-imports
    "T201",  # no-print
]
ignore = [
    "UP015", # Unnecessary open mode parameters
    "PLC1901", # compare-to-empty-string
    "PLR0913", # Too many arguments to function call
    "S311",  # pseudo-random generators are not suitable for cryptographic purposes - we use them to randomize training data
    "S105",  # we use the term "token" for transformer tokens which sometimes triggers false positives of this warning
    "UP035",  # mypy doesn't seem to support "from typing import Self" yet
    "PLR0912",  # the parsing & conversion logic tends to create large functions, if someone has an idea then open a PR please!
    "PLR0915",  # the parsing & conversion logic tends to create large functions, if someone has an idea then open a PR please!
    "C901",  # the parsing & conversion logic tends to create large functions , if someone has an idea then open a PR please!
    "PLR2004",  #
    "PLR0911",  # the parsing & conversion logic tends to create large functions, if someone has an idea then open a PR please!

]

# The rules below are right for `homr/`, which ships, and wrong for the trees that do
# not. Scoping them per directory keeps the shipping package strict instead of relaxing
# a rule everywhere to accommodate a script.
[tool.ruff.lint.per-file-ignores]
"training/**" = [
    "T201",  # these are command-line scripts; printing their results is the point, and many already carry a file-level noqa for it
    "PLC0415",  # imports are deferred on purpose, so a script that never touches torch does not pay for importing it
    "S314",  # the XML being parsed is our own corpus, produced by MuseScore, not untrusted input
    "S603",  # subprocess calls are to tools the developer running the script already has
    "S607",  # and are invoked by name so they resolve on the developer's own PATH
    "S104",  # the review servers bind 0.0.0.0 to be reachable from the host while running in a container
    "B905",  # 34 call sites that each need their own answer on whether the lengths are guaranteed equal - see the note below
]
"validation/**" = ["S608", "B905"]
# E501 cannot be suppressed inline where the long line is *inside* a string literal -
# a `# noqa` there would become part of the string. These two cases are exactly that:
# XML/YAML fixtures written literally so a reader can see what is being parsed, and the
# review servers' embedded CSS/JS, which cannot be wrapped without changing what the
# page does. Everywhere else the long lines were wrapped rather than excused.
"tests/**" = ["S101", "PLC0415", "S314", "B905", "E501"]
"training/omr_datasets/review_server.py" = ["E501"]
"training/omr_datasets/stage2_pair_review_server.py" = ["E501"]
"training/omr_datasets/stage3_text_review_server.py" = ["E501"]
"training/omr_datasets/ossq_pair_review_server.py" = ["E501"]

# On B905: `zip()` without `strict=` is a real correctness lint and `homr/` enforces it -
# `tuplet_repair` gained a `strict=True` that turned a documented invariant into an
# enforced one. Each remaining call site needs the same question asked of it, and
# answering 34 of them with a blanket `strict=False` would look like a decision had been
# made when none had. Deferred deliberately rather than papered over.

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.isort]
profile = "black"
sections = "FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER"

[tool.mypy]
python_version = "3.10"

cache_dir = ".mypy_cache/strict"
show_error_codes = true
show_column_numbers = true

# Strict guidelines taken from https://github.com/pytorch/pytorch/blob/master/mypy-strict.ini
# Across versions of mypy, the flags toggled by --strict vary.  To ensure
# we have reproducible type check, we instead manually specify the flags
follow_imports = "normal"
warn_no_return = true
warn_return_any = false
disallow_any_unimported = false
disallow_any_generics = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
implicit_reexport = false
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "training.architecture.transformer.custom_x_transformer"
ignore_errors = true

[[tool.mypy.overrides]]
module = "validation.*"
warn_unused_ignores = false

[tool.pytest.ini_options]
log_cli = true
log_cli_level = 10
testpaths = ["tests"]

[project.scripts]
homr = "homr.main:main"
